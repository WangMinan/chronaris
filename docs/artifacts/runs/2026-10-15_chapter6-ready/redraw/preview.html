<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>航空人机时序融合系统</title>
  <style>:root {
  --nav: #152f39; --ink: #18343e; --muted: #536d75; --accent: #087e83;
  --border: #dce5e5; --bg: #f3f6f5; --white: #fff; --danger: #a73530;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.6; }
button, select, input { font: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible, summary:focus-visible { outline: 3px solid #bd861d; outline-offset: 3px; }
[hidden] { display: none !important; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 216px; background: var(--nav); color: #eff8f6; padding: 30px 20px; display: flex; flex-direction: column; }
.brand { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; font-size: 19px; font-weight: 600; line-height: 1.5; }
.brand-icon { display: grid; place-items: center; width: 38px; height: 44px; color: #86dbcc; font-size: 40px; }
nav { margin-top: 48px; }
.nav { display: block; width: 100%; border: 0; background: none; color: #c4d4d7; text-align: left; padding: 14px 16px; border-radius: 6px; margin: 8px 0; }
.nav:hover { background: #203f49; }
.nav.active { background: #294954; color: white; box-shadow: inset 3px 0 #78d5c2; }
.connection { margin-top: auto; color: #c4d4d7; font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; background: #66c4ac; border-radius: 50%; margin-right: 8px; }
.dot.error { background: #f7a28d; }
main { margin-left: 216px; padding: 28px 32px; max-width: 1800px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
h1 { font-size: 26px; margin: 0; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 15px; margin: 22px 0 12px; }
p { margin: 12px 0; }
.muted, .field-hint { color: var(--muted); font-size: 13px; }
.field-hint { margin: 8px 0; }
.field-hint.error { color: var(--danger); }
.panel { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 24px; min-width: 0; }
.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 0 0 18px; }
.panel-heading p { margin-bottom: 0; }
.data-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
label { display: block; margin: 12px 0 6px; }
select, input[type=number], input[type=search] { width: 100%; padding: 10px 12px; background: #fcfdfd; border: 1px solid #c7d5d5; border-radius: 5px; color: var(--ink); min-width: 0; }
input[type=range] { accent-color: var(--accent); cursor: pointer; min-width: 80px; }
input[type=checkbox] { accent-color: var(--accent); width: 17px; height: 17px; }
.check { display: flex; align-items: center; gap: 8px; margin: 0; }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; padding: 10px 16px; border-radius: 5px; text-decoration: none; font-weight: 600; white-space: nowrap; }
.primary { background: var(--accent); color: white; }
.primary:hover { background: #06686c; }
.secondary { background: white; color: var(--accent); border-color: #bfd2d3; }
.secondary:hover { background: #edf6f3; }
.text-button { border: 0; background: none; color: var(--accent); padding: 8px; }
.tag { font-size: 12px; color: #365f5f; background: #edf5f2; border: 1px solid #dbe9e3; border-radius: 4px; padding: 4px 8px; white-space: nowrap; }
.task-actions { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 24px; }
.task-status { display: flex; flex-direction: column; align-items: stretch; }
.task-status > button { align-self: flex-start; }
.progress-label { display: flex; justify-content: space-between; gap: 12px; margin: 24px 0 8px; }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
.pipeline { display: flex; justify-content: space-between; list-style: none; padding: 0; margin: 16px 0 32px; font-size: 13px; color: var(--muted); gap: 10px; }
.pipeline .done { color: var(--accent); font-weight: 600; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; text-align: left; font-size: 13px; }
th { font-weight: 500; color: var(--muted); background: #f5f8f7; white-space: nowrap; }
th, td { padding: 12px 10px; border-bottom: 1px solid #e5ebeb; }
td button { font: inherit; }
#message, #dialog-message { background: #e5f1ee; border: 1px solid #bdd8cf; color: #244d47; padding: 12px 16px; margin-bottom: 20px; border-radius: 6px; overflow-wrap: anywhere; }
.empty { padding: 70px 24px; text-align: center; color: var(--muted); }
.replay-controls { display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
.replay-controls label { margin: 0; }
.replay-controls input { flex: 1; }
.replay-controls strong { font-size: 13px; }
figure { margin: 0 0 20px; }
figure:last-child { margin-bottom: 0; }
figcaption { font-size: 13px; margin-bottom: 8px; }
.traces svg { display: block; width: 100%; height: 110px; }
.traces text { fill: #536d75; font-family: inherit; font-size: 12px; }
.trace-value { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.gradient { width: 120px; height: 10px; background: linear-gradient(90deg,#217b8b,#f2f3eb,#d99b50); }
.heat-layout { display: flex; gap: 8px; }
.heat-y { display: flex; flex-direction: column; justify-content: space-between; width: 46px; flex: none; font-size: 12px; color: var(--muted); }
#heatmap { width: calc(100% - 54px); height: 240px; cursor: crosshair; }
.axis { display: flex; justify-content: space-between; margin: 8px 0 20px 54px; color: var(--muted); font-size: 12px; }
.query { display: grid; grid-template-columns: auto 1fr auto 80px; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.query label { margin: 0; }
#query-value { display: block; margin-top: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.download-links { display: flex; flex-wrap: wrap; gap: 20px; margin: 22px 0; }
a { color: var(--accent); }
details { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 24px; }
summary { cursor: pointer; }
dt { color: var(--muted); font-size: 13px; margin-top: 14px; }
dd { margin: 4px 0 0; overflow-wrap: anywhere; font-size: 13px; }
.model-list { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 16px; }
.model-card { background: #f5f8f7; padding: 18px; border-radius: 6px; }
.model-card p { font-size: 13px; margin: 8px 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.toolbar select { width: auto; }
.pagination { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-top: 16px; font-size: 13px; }
dialog { border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 600px; width: calc(100% - 32px); max-height: 90vh; color: var(--ink); }
dialog::backdrop { background: #102d3980; }
dialog > .primary { margin-top: 20px; }
dialog input[type=file] { max-width: 100%; margin-bottom: 16px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 1100px) {
  .sidebar { width: 185px; padding: 24px 14px; }
  main { margin-left: 185px; padding: 24px; }
  .panel { padding: 20px; }
  .data-grid { grid-template-columns: 1.15fr 1fr; gap: 18px; }
  .pipeline { flex-wrap: wrap; }
  .task-actions { gap: 10px; }
}
@media (max-width: 760px) {
  .sidebar { position: static; width: 100%; padding: 16px; }
  .brand { font-size: 16px; }
  .brand br { display: none; }
  .brand-icon { height: 30px; font-size: 32px; }
  nav { display: flex; margin-top: 14px; gap: 4px; }
  .nav { text-align: center; padding: 10px 4px; font-size: 13px; margin: 0; }
  .connection { display: none; }
  main { margin: 0; padding: 20px 16px; }
  h1 { font-size: 22px; }
  header { gap: 12px; }
  .data-grid, .two-col { grid-template-columns: 1fr; gap: 0; }
  .panel { padding: 18px; }
  .two-col > article { margin-bottom: 20px; }
  .panel-heading { flex-wrap: wrap; gap: 12px; }
  .replay-controls { flex-wrap: wrap; }
  .replay-controls strong { width: 100%; }
  .query { grid-template-columns: auto 1fr; }
  .query input[type=number] { width: 80px; }
  .task-actions { flex-wrap: wrap; }
  .gradient { width: 90px; }
  #query-value { font-size: 13px; }
}
.history .table-wrap { max-height: 420px; overflow: auto; }
.history th { position: sticky; top: 0; z-index: 1; }

#run,#deliver,#add-data,.download-links,#download-zip,[data-tab=data],[data-tab=models]{display:none}</style>


</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-icon" aria-hidden="true">∿</span><span>航空人机<br>时序融合系统</span></a>
    <nav aria-label="主要功能">
      <button class="nav active" data-tab="data" aria-current="page">数据与任务</button>
      <button class="nav" data-tab="models">模型与字段</button>
      <button class="nav" data-tab="results">结果分析</button>
      <button class="nav" data-tab="exports">特征交付</button>
    </nav>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection">正在连接</span></div>
  </aside>
  <main>
    <header><h1 id="page-title">数据与任务</h1><span id="record-total" class="muted"></span></header>
    <div id="message" role="status" aria-live="polite" hidden></div>
    <section id="data" class="view">
      <div class="data-grid">
        <article class="panel">
          <div class="panel-heading"><h2>新建处理任务</h2><button id="add-data" class="secondary">接入数据</button></div>
          <label for="case">观测记录</label><select id="case"></select>
          <div class="two-col">
            <div><label for="start">起始窗口</label><select id="start"></select></div>
            <div><label for="stop">结束窗口</label><select id="stop"></select></div>
          </div>
          <p id="range-label" class="field-hint" aria-live="polite"></p>
          <label for="model">处理模型</label><select id="model"></select>
          <div class="task-actions"><label class="check"><input id="incremental" type="checkbox">处理新增窗口</label><button id="run" class="primary" disabled>开始处理 →</button></div>
        </article>
        <article class="panel task-status">
          <div class="panel-heading"><h2>当前任务</h2><span id="status-badge" class="tag">待创建</span></div>
          <p id="task-name">选择观测记录，开始处理。</p>
          <div class="progress-label"><span id="progress-text">等待任务</span><strong id="progress-number">0%</strong></div>
          <progress id="progress" max="100" value="0" aria-label="任务进度"></progress>
          <ol id="pipeline" class="pipeline"><li>校验输入</li><li>生成特征</li><li>封装结果</li></ol>
          <button id="open-results" class="secondary" disabled>查看本次结果 →</button>
          <button id="retry-current" class="secondary" hidden>按原参数重试</button>
        </article>
      </div>
      <article class="panel history">
        <div class="panel-heading"><h2>处理记录</h2><button id="refresh" class="text-button">刷新</button></div>
        <div id="history" class="table-wrap"></div>
      </article>
    </section>
    <section id="models" class="view" hidden>
      <article class="panel"><div class="panel-heading"><h2>可用模型</h2><button id="refresh-models" class="text-button">刷新模型</button></div><div id="model-list" class="model-list"></div></article>
      <article class="panel">
        <div class="panel-heading"><h2>字段解释与规则复核</h2><span id="field-count" class="tag"></span></div>
        <div class="toolbar"><label for="field-search" class="sr-only">检索字段</label><input id="field-search" type="search" placeholder="检索字段或规则"><select id="field-filter" aria-label="复核状态"><option value="all">全部条目</option><option value="pending">待复核</option><option value="approved">已确认</option><option value="needs_revision">待修订</option></select><button id="approve-fields" class="secondary">确认选中项</button><button id="revise-fields" class="text-button">标记待修订</button></div>
        <div id="field-table" class="table-wrap"></div><div class="pagination"><button id="fields-prev" class="text-button">上一页</button><span id="fields-page"></span><button id="fields-next" class="text-button">下一页</button></div>
      </article>
    </section>
    <section id="results" class="view" hidden>
      <div class="panel empty result-empty">选择一条已完成的处理记录，查看结果。</div>
      <div class="result-content" hidden>
        <div class="panel-heading"><div><h2 id="result-title"></h2><p id="result-identity" class="field-hint"></p></div><button id="to-export" class="primary">交付特征 →</button></div>
        <div class="panel replay-controls"><button id="play" class="secondary">播放</button><label for="window-slider">窗口</label><input id="window-slider" type="range" min="0" max="0" value="0"><strong id="window-label"></strong></div>
        <div class="two-col"><article class="panel"><div class="panel-heading"><h2>生理观测</h2><span id="phys-coverage" class="tag"></span></div><div id="phys-traces" class="traces"></div></article><article class="panel"><div class="panel-heading"><h2>航电观测</h2><span id="vehicle-coverage" class="tag"></span></div><div id="vehicle-traces" class="traces"></div></article></div>
        <article class="panel fusion">
          <div class="panel-heading"><h2>融合特征</h2><div class="heat-legend"><span id="scale-min"></span><span class="gradient"></span><span id="scale-max"></span></div></div>
          <div class="heat-layout"><div class="heat-y"><span>维度 1</span><span id="last-dimension">64</span></div><canvas id="heatmap" width="1100" height="240" tabindex="0" role="img" aria-label="融合特征热力图，可用方向键选择时刻和维度"></canvas></div>
          <div class="axis"><span>0 秒</span><span>窗口内时间</span><span id="end-time"></span></div>
          <div class="query"><label for="query">参考时刻</label><input id="query" type="range" min="0" max="95" value="0"><label for="dimension">特征维度</label><input id="dimension" type="number" min="1" max="64" value="1"></div>
          <output id="query-value" aria-live="polite"></output>
        </article>
      </div>
    </section>
    <section id="exports" class="view" hidden>
      <div class="panel empty result-empty">选择一条已完成的处理记录，交付特征。</div>
      <div class="result-content" hidden>
        <div class="data-grid"><article class="panel"><h2>特征文件</h2><p id="export-summary"></p><a id="download-zip" class="primary" download>下载完整特征包 ↓</a><div class="download-links"><a id="download-csv" download>序列特征表</a><a id="download-npz" download>标准表示文件</a><a id="download-manifest" download>来源清单</a></div><h3>特征预览</h3><p id="feature-position" class="field-hint"></p><div id="feature-table" class="table-wrap"></div></article>
        <article class="panel"><h2>下游交付</h2><p>生成各窗口的汇总特征，供下游任务读取。</p><button id="deliver" class="primary">生成汇总特征</button><p id="delivery-status" role="status"></p><a id="download-pooled" class="secondary" download hidden>下载汇总特征表 ↓</a><details><summary>来源详情</summary><dl id="provenance"></dl></details></article></div>
      </div>
    </section>
  </main>
  <dialog id="data-dialog">
    <form method="dialog" class="panel-heading"><h2>接入观测数据</h2><button aria-label="关闭" class="text-button">✕</button></form>
    <div id="dialog-message" role="status" hidden></div>
    <label for="source">归档记录</label><select id="source"></select>
    <div class="two-col"><div><label for="source-start">起始时间（秒）</label><input id="source-start" type="number" min="0"></div><div><label for="source-stop">结束时间（秒）</label><input id="source-stop" type="number" min="0"></div></div>
    <button id="prepare-source" class="primary">接入所选时段</button>
    <hr><h3>导入观测文件</h3>
    <label for="import-model">字段与模型</label><select id="import-model"></select>
    <label for="import-file">标准观测文件（JSON）</label><input id="import-file" type="file" accept=".json,application/json">
    <label class="check"><input id="append-record" type="checkbox">追加到当前导入记录</label>
    <div class="toolbar"><button id="import-record" class="primary">校验并导入</button><button id="import-template" class="text-button">下载输入格式</button></div>
  </dialog>

  document.querySelectorAll('.nav').forEach(el=>{el.classList.toggle('active',el.dataset.tab===name);el.setAttribute('aria-current',el.dataset.tab===name?'page':'false');});
  $('page-title').textContent={data:'数据与任务',models:'模型与字段',results:'结果分析',exports:'特征交付'}[name];
  if(name!=='results') stopPlayback();
  if(name==='models') loadFields();
  window.scrollTo(0,0);
  if(name==='results' && result) renderWindow();
}
function selectedCase() { return cases.find(c=>c.id===$('case').value); }
function busy() { return submitting || activeJob && !['completed','failed'].includes(activeJob.status); }
function validRange() {
  const c=selectedCase(), start=Number($('start').value), stop=Number($('stop').value);
  return !!(c && start>=0 && stop>=start && stop<c.windows.length && $('model').value);

function syncRunButton() { $('run').disabled=!serviceReady || busy() || !validRange(); }
function rangeLabel() {
  const c=selectedCase(); if(!c) return;

  $('range-label').textContent=valid?`${stop-start+1} 个窗口 · ${number(c.windows[start].start_s)}—${number(c.windows[stop].start_s+c.windows[stop].duration_s)} 秒`:'结束窗口须不早于起始窗口。';
  $('range-label').classList.toggle('error',!valid);
  $('stop').setAttribute('aria-invalid',String(!valid)); syncRunButton();
}
function configureCase() {
  const c=selectedCase();
  if(!c) { $('start').replaceChildren();$('stop').replaceChildren();$('model').replaceChildren();syncRunButton();return; }
  for(const name of ['start','stop']) $(name).replaceChildren(...c.windows.map((w,i)=>new Option(`${w.label} · ${number(w.start_s)}—${number(w.start_s+w.duration_s)} 秒`,i)));
  $('stop').value=c.windows.length-1;
  const compatible=models.filter(m=>m.compatible_cases.includes(c.id));
  $('model').replaceChildren(...compatible.map(m=>new Option(m.label,m.id)));
  if(compatible.some(m=>m.id===c.checkpoint_sha256)) $('model').value=c.checkpoint_sha256;
  $('append-record').disabled=!c.appendable; $('append-record').checked=false;
  rangeLabel(); if(!$('models').hidden) loadFields();
}
async function refreshCatalog(selectId) {
  const previous=selectId || $('case').value;
  cases=await api('/api/cases'); models=await api('/api/models');
  $('case').replaceChildren(...cases.map(c=>new Option(c.title,c.id)));
  if(cases.some(c=>c.id===previous)) $('case').value=previous;
  $('record-total').textContent=`${cases.length} 份观测记录`;
  $('import-model').replaceChildren(...models.map(m=>new Option(m.label,m.id)));
  serviceReady=true; configureCase(); renderModels();

function setProgress(job) {
  activeJob=job;
  const percent=job.status==='completed'?100:job.status==='queued'?0:job.status==='loading'?5:Math.round(10+job.done/job.total*80);
  $('progress').value=percent; $('progress-number').textContent=percent+'%';
  $('status-badge').textContent=labels[job.status]||job.status;
  $('task-name').textContent=`${job.title}${job.range_s?' · '+job.range_s.map(n=>number(n)).join('—')+' 秒':''}`;
  $('progress-text').textContent=job.status==='failed'?job.error:`${job.done} / ${job.total} 个窗口${job.elapsed_s?' · '+number(job.elapsed_s)+' 秒':''}`;
  $('open-results').disabled=job.status!=='completed';
  $('retry-current').hidden=!(job.status==='failed' && job.request);
  const step={queued:0,loading:0,inference:1,exporting:2,completed:3,failed:0}[job.status];
  [...$('pipeline').children].forEach((el,i)=>el.classList.toggle('done',i<step));
  syncRunButton();
}
async function poll(id) {
  clearTimeout(pollTimer);
  try {
    const job=await api(`/api/runs/${id}`);
    if(id!==activeJobId) return;
    setProgress(job);
    if(!['completed','failed'].includes(job.status)) { pollTimer=setTimeout(()=>poll(id),700); return; }
    await history();
    if(job.status==='completed' && !viewedRunId) await openResult(id,false);
    if(job.status==='failed') message(job.error);
  } catch(e) {
    if(id!==activeJobId) return;
    connected(false); message(`任务状态读取失败：${e.message}`);
    if(e.status!==404) pollTimer=setTimeout(()=>poll(id),2000);
  }
}
function trackJob(job) { activeJobId=job.id; localStorage.setItem('fusion-active-job',job.id); setProgress(job); poll(job.id); }
async function run() {
  if(!validRange() || busy()) return;
  submitting=true; syncRunButton(); message();
  try { const job=await api('/api/runs',{case_id:$('case').value,start:Number($('start').value),stop:Number($('stop').value)+1,model_id:$('model').value,incremental:$('incremental').checked});trackJob(job); }
  catch(e) { message(e.message); }
  finally { submitting=false;syncRunButton(); }
}
async function retry(id) {
  const job=await api(`/api/runs/${id}/retry`,{}); message(); trackJob(job); tab('data');
}
async function history() {
  jobs=await api('/api/runs'); const container=$('history');container.replaceChildren();
  if(!jobs.length) { container.textContent='处理记录将在任务创建后显示。'; return; }
  const table=document.createElement('table'), header=table.insertRow();
  ['观测记录','时间范围','创建时间','状态','窗口','操作'].forEach(x=>cell(header,x,'th'));
  jobs.forEach(job=>{
    const row=table.insertRow(); cell(row,job.title);
    cell(row,job.range_s?job.range_s.map(x=>number(x)).join('—')+' 秒':'历史记录');
    cell(row,new Date(job.created_at).toLocaleString('zh-CN',{hour12:false})); cell(row,labels[job.status]);cell(row,`${job.done}/${job.total}`);
    const action=cell(row,'');
    if(job.status==='completed') action.append(button('查看结果',()=>openResult(job.id)));
    else if(job.status==='failed') { action.append(button('失败原因',()=>message(job.error)));if(job.retryable) action.append(button('重试',()=>retry(job.id))); }
    else action.append(button('查看进度',()=>{activeJobId=job.id;setProgress(job);poll(job.id);tab('data');}));
  });container.append(table);
}
async function openResult(id,switchTab=true) {
  const token=++resultRequest;
  try {
    const next=await api(`/api/runs/${id}/result`);
    if(token!==resultRequest) return;
    stopPlayback();result=next;viewedRunId=id;
    scale=.001; result.windows.forEach(w=>w.embedding.forEach(row=>row.forEach(v=>{scale=Math.max(scale,Math.abs(v));})));
    document.querySelectorAll('.result-empty').forEach(el=>el.hidden=true);
    document.querySelectorAll('.result-content').forEach(el=>el.hidden=false);
    $('result-title').textContent=result.case.title;
    const job=jobs.find(j=>j.id===id);
    $('result-identity').textContent=`${job?new Date(job.created_at).toLocaleString('zh-CN',{hour12:false}):'处理记录'} · ${result.windows.length} 个窗口`;
    $('window-slider').max=result.windows.length-1;$('window-slider').value=0;
    $('query').max=result.windows[0].times.length-1;$('query').value=0;
    $('dimension').max=result.output_dim;$('dimension').value=1;
    if(switchTab) tab('results');
    renderWindow();renderExport();
    const receipt=await api(`/api/runs/${id}/delivery`);
    if(viewedRunId===id) renderDelivery(receipt);
  } catch(e) { if(token===resultRequest) message(e.message); }
}
function currentWindow() { return result?.windows[Number($('window-slider').value)]; }
function renderWindow() {
  const w=currentWindow();if(!w)return;
  $('window-label').textContent=`${w.label} · ${number(w.start_s)}—${number(w.start_s+w.duration_s)} 秒`;
  $('phys-coverage').textContent=`观测率 ${number(w.physiology.coverage*100,1)}%`;
  $('vehicle-coverage').textContent=`观测率 ${number(w.vehicle.coverage*100,1)}%`;
  $('end-time').textContent=number(w.duration_s)+' 秒';
  $('last-dimension').textContent=w.embedding[0].length;

}
function renderQuery() {
  const w=currentWindow();if(!w)return;

  $('query-value').textContent=`记录时间 ${number(w.start_s+t,3)} 秒 · 窗口内 ${number(t,3)} 秒 · 维度 ${f+1} · ${w.valid[q]?number(w.embedding[q][f],5):'无效'}`;
  FusionCharts.traces($('phys-traces'),w.physiology,w.duration_s,'#087e83',t);
  FusionCharts.traces($('vehicle-traces'),w.vehicle,w.duration_s,'#a7722c',t);

function renderFeatureTable() {
  const w=currentWindow();if(!w)return;
  const q=Number($('query').value),first=Math.max(0,Math.min(w.embedding[0].length-6,Number($('dimension').value)-1));
  $('feature-position').textContent=`${w.label} · 窗口内 ${number(w.times[q],3)} 秒`;
  const table=document.createElement('table'),header=table.insertRow();

async function deliver() {

function stopPlayback() { clearInterval(playTimer);playTimer=null;$('play').textContent='播放'; }

async function loadFields() {

  try {const rows=await api(`/api/fields/${id}`);if(token!==fieldRequest)return;fields=rows;fieldPage=0;renderFields();}catch(e){message(e.message);}

function renderFields() {

async function reviewFields(decision) {

  try{await api(`/api/fields/${$('case').value}`,{ids,decision});await loadFields();message('复核结论已保存。');}catch(e){message(e.message);}
}
function configureSource() {
  const source=sources.find(s=>s.id===$('source').value);$('prepare-source').disabled=!source;

function dialogMessage(text) { $('dialog-message').textContent=text;$('dialog-message').hidden=false; }

$('case').onchange=configureCase;$('start').onchange=rangeLabel;$('stop').onchange=rangeLabel;$('model').onchange=syncRunButton;
